basePath: /
definitions:
  models.Response:
    properties:
      data: {}
      message:
        example: Success message
        type: string
      success:
        example: true
        type: boolean
    type: object
  models.User:
    properties:
      email:
        example: koda@mail.com
        type: string
      password:
        example: koda123
        format: password
        minLength: 6
        type: string
      username:
        example: koda
        maxLength: 20
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
host: localhost:8080
info:
  contact: {}
  description: Dokumentasi REST API menggunakan Gin dan Swagger
  title: API Documentation
  version: "1.0"
paths:
  /auth/forgot-password/{id}:
    patch:
      consumes:
      - application/x-www-form-urlencoded
      description: Change user password
      parameters:
      - description: User Id
        in: path
        name: id
        required: true
        type: integer
      - description: Input new password
        format: password
        in: formData
        name: newPassword
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Invalid ]request body or hashing password failed
          schema:
            $ref: '#/definitions/models.Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/models.Response'
      summary: Forgot password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Log in with existing email and username data
      parameters:
      - description: Email address
        in: formData
        name: email
        required: true
        type: string
      - description: Input Password
        format: password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User login Successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Invalid request body or hash password failed
          schema:
            $ref: '#/definitions/models.Response'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/models.Response'
      summary: Login user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Create a new user with a unique username and email
      parameters:
      - example: koda@mail.com
        in: formData
        name: email
        required: true
        type: string
      - example: koda123
        format: password
        in: formData
        minLength: 6
        name: password
        required: true
        type: string
      - example: koda
        in: formData
        maxLength: 20
        minLength: 3
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User created successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Invalid request body or hash password failed
          schema:
            $ref: '#/definitions/models.Response'
        "409":
          description: Email or username already exists
          schema:
            $ref: '#/definitions/models.Response'
      summary: Create new user
      tags:
      - auth
  /users:
    get:
      description: Retrieving all user data
      produces:
      - application/json
      responses:
        "200":
          description: Success get all users
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.User'
                  type: array
              type: object
      summary: Get all users
      tags:
      - users
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Create a new user with a unique username and email
      parameters:
      - example: koda@mail.com
        in: formData
        name: email
        required: true
        type: string
      - example: koda123
        format: password
        in: formData
        minLength: 6
        name: password
        required: true
        type: string
      - example: koda
        in: formData
        maxLength: 20
        minLength: 3
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User created successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Invalid request body or hash password failed
          schema:
            $ref: '#/definitions/models.Response'
        "409":
          description: Email or username already exists
          schema:
            $ref: '#/definitions/models.Response'
      summary: Create new user
      tags:
      - users
  /users/{id}:
    delete:
      consumes:
      - application/x-www-form-urlencoded
      description: Delete user by Id
      parameters:
      - description: User Id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Invalid Id format
          schema:
            $ref: '#/definitions/models.Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/models.Response'
      summary: Delete user
      tags:
      - users
    get:
      consumes:
      - application/x-www-form-urlencoded
      description: Retrieving user data based on Id
      parameters:
      - description: User Id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success get user
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Invalid Id format
          schema:
            $ref: '#/definitions/models.Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/models.Response'
      summary: Get user by Id
      tags:
      - users
    patch:
      consumes:
      - application/x-www-form-urlencoded
      description: Updating user data (username and email) based on Id
      parameters:
      - description: User Id
        in: path
        name: id
        required: true
        type: integer
      - description: Username (min 3, max 20 chars)
        in: formData
        name: username
        required: true
        type: string
      - description: Email address
        in: formData
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Invalid Id format or request body
          schema:
            $ref: '#/definitions/models.Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/models.Response'
      summary: Update user
      tags:
      - users
  /users/{id}/upload-profile:
    patch:
      consumes:
      - multipart/form-data
      description: Upload or replace the profile picture for a user by Id.
      parameters:
      - description: User Id
        in: path
        name: id
        required: true
        type: integer
      - description: Profile picture (JPEG or PNG, max 1MB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Successfully uploaded photo profile
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad request (invalid Id, wrong file type, or file too large)
          schema:
            $ref: '#/definitions/models.Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: Failed to save file
          schema:
            $ref: '#/definitions/models.Response'
      summary: Upload user profile picture
      tags:
      - users
swagger: "2.0"
